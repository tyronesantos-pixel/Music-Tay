    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlayerTyrone" />
    <script>
      // Ignore HMR WebSocket errors in iframe/sandboxed environments
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('reading \'send\'') !== -1 || e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('[vite]') !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason ? (e.reason.message || String(e.reason)) : '';
        if (msg.indexOf('reading \'send\'') !== -1 || msg.indexOf('WebSocket') !== -1 || msg.indexOf('[vite]') !== -1) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function() {});
        });
      }
    </script>
