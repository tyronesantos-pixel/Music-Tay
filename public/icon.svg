<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b122c"/>
      <stop offset="50%" stop-color="#120f1d"/>
      <stop offset="100%" stop-color="#09080e"/>
    </linearGradient>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle glowing ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#prismGrad)" stroke-width="4" opacity="0.35"/>

  <!-- Glowing Emblem -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="170" fill="url(#prismGrad)"/>
  </g>

  <!-- Inner core -->
  <circle cx="256" cy="256" r="162" fill="#13101b" opacity="0.3"/>

  <!-- Play & Equalizer Dynamic Waveform -->
  <g fill="url(#barGrad)">
    <!-- Play arrow stylized -->
    <path d="M 215 160 L 335 256 L 215 352 Z" fill="#ffffff" opacity="0.95"/>
    
    <!-- Sound Waves on right -->
    <rect x="360" y="216" width="14" height="80" rx="7" fill="#22d3ee"/>
    <rect x="388" y="236" width="14" height="40" rx="7" fill="#67e8f9"/>
    
    <!-- Rhythm Bar on left -->
    <rect x="176" y="226" width="14" height="60" rx="7" fill="#a78bfa"/>
    <rect x="148" y="244" width="14" height="24" rx="7" fill="#c4b5fd"/>
  </g>
</svg>
